        const firebaseConfig = {
            apiKey: "AIzaSyDdCWNLDkZEnElnHMoBlVewu8W7uJc2XeU",
            authDomain: "bct-66404.firebaseapp.com",
            databaseURL: "https://bct-66404-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bct-66404",

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // Expose functions globally for the HTML events
        window.db = db;

    <!-- ... Keep your existing HTML structure here ... -->

    <script>
        const userCredentials = { 'Eng. Ahmed Nabil': 'Bayan2026', 'Eng. Youssef Nabil': 'Bayan2026', 'Eng. Noha Alhaddad': 'Bayan2026', 'Eng. Nabil Hassan': 'Bayan2026' };
        let currentActiveUser = "";

        function handleLogin(event) {
            event.preventDefault();
            const selectedId = document.getElementById('portal-id').value;
            if (userCredentials[selectedId] === document.getElementById('password').value) {
                currentActiveUser = selectedId;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'grid';
                document.getElementById('displayUser').innerText = selectedId;
                initFirebaseSync();
            } else {
                alert("Invalid Password.");
            }
        }

        function initFirebaseSync() {
            // Presence: Set online
            const userStatusRef = ref(window.db, 'presence/' + currentActiveUser);
            set(userStatusRef, { status: 'online' });
            onDisconnect(userStatusRef).remove();

            // Listen for online users
            onValue(ref(window.db, 'presence/'), (snapshot) => {
                const listDiv = document.getElementById('presenceList');
                listDiv.innerHTML = "";
                snapshot.forEach(child => {
                    listDiv.insertAdjacentHTML('beforeend', `<div style="font-size: 12px; color: #fff; padding: 4px 0;"><span class="status-dot"></span> ${child.key}</div>`);
                });
            });

            // Listen for messages
            onValue(ref(window.db, 'messages/'), (snapshot) => {
                document.getElementById('messagesWindow').innerHTML = "";
                snapshot.forEach(child => {
                    const data = child.val();
                    displayIncomingMessage(data.user, data.message, data.user === currentActiveUser, data.file, data.fileName);
                });
            });
        }

        function sendMessage(event) {
            event.preventDefault();
            const input = document.getElementById('typeBox');
            if (input.value.trim() === "") return;
            push(ref(window.db, 'messages/'), {
                user: currentActiveUser,
                message: input.value,
                timestamp: Date.now()
            });
            input.value = "";
        }

        // Updated display logic to handle Firebase structure
        function displayIncomingMessage(sender, message, isSelf, fileData, fileName) {
            const windowObj = document.getElementById('messagesWindow');
            let content = message || "";
            if (fileData) {
                content += `<br><a href="${fileData}" target="_blank">📥 ${fileName}</a>`;
            }
            windowObj.insertAdjacentHTML('beforeend', `<div class="msg ${isSelf ? 'sent' : 'received'}"><span class="msg-meta">${sender}</span>${content}</div>`);
            windowObj.scrollTop = windowObj.scrollHeight;
        }

        function handleLogout() {
            set(ref(window.db, 'presence/' + currentActiveUser), null);
            location.reload();
        }
    </script>
</body>
</html>
