<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BAYAN Company (BCT) - Communication Portal</title>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-database.js";

        // CONFIGURATION (Place this in config.js for security)
        const firebaseConfig = {
            apiKey: "AIzaSyDiC7pfe_Bwg2-k8b_vG5czJHaOrJieEmE",
            authDomain: "bct-66404.firebaseapp.com",
            databaseURL: "https://bct-66404-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bct-66404",
            storageBucket: "bct-66404.firebasestorage.app",
            messagingSenderId: "337031921557",
            appId: "1:337031921557:web:b28321a917c3bdf572809c",
            measurementId: "G-LZ2XK1EF0H"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // App State
        const userCredentials = { 'Eng. Ahmed Nabil': 'Bayan2026', 'Eng. Youssef Nabil': 'Bayan2026', 'Eng. Noha Alhaddad': 'Bayan2026', 'Eng. Nabil Hassan': 'Bayan2026' };
        let currentActiveUser = "";

        // UI Logic
        window.handleLogin = (event) => {
            event.preventDefault();
            const id = document.getElementById('portal-id').value;
            const pass = document.getElementById('password').value;
            if (userCredentials[id] === pass) {
                currentActiveUser = id;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'grid';
                document.getElementById('displayUser').innerText = id;
                initFirebaseSync();
            } else {
                alert("Invalid Password");
            }
        };

        function initFirebaseSync() {
            onChildAdded(ref(db, 'messages/'), (snapshot) => {
                const data = snapshot.val();
                displayIncomingMessage(data.user, data.message, (data.user === currentActiveUser), data.file, data.fileName);
            });
        }

        window.sendMessage = (event) => {
            event.preventDefault();
            const input = document.getElementById('typeBox');
            if (input.value.trim() === "") return;
            push(ref(db, 'messages/'), {
                user: currentActiveUser,
                message: input.value,
                timestamp: serverTimestamp()
            });
            input.value = "";
        };

        window.handleFileSelection = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                push(ref(db, 'messages/'), {
                    user: currentActiveUser,
                    file: e.target.result,
                    fileName: file.name
                });
            };
            reader.readAsDataURL(file);
        };

        function displayIncomingMessage(sender, message, isSelf, fileData, fileName) {
            const windowObj = document.getElementById('messagesWindow');
            let content = message ? message : "";
            if (fileData) {
                const isImg = fileData.startsWith('data:image');
                content += `<div style="margin-top:5px">
                    <a href="${fileData}" download="${fileName}" style="color:var(--primary-gold); font-weight:bold; text-decoration:none">
                        ${isImg ? `<img src="${fileData}" style="max-width:100%; display:block; border-radius:4px; margin-bottom:5px">` : "📄"} 
                        📥 ${fileName}
                    </a>
                </div>`;
            }
            windowObj.insertAdjacentHTML('beforeend', `<div class="msg ${isSelf ? 'sent' : 'received'}"><span class="msg-meta">${sender}</span>${content}</div>`);
            windowObj.scrollTop = windowObj.scrollHeight;
        }

        window.handleLogout = () => location.reload();
    </script>
    
    <!-- Keep your original CSS styles here -->
    <style>
        /* [Insert your existing CSS styles from the previous code block] */
    </style>
</head>
<body>
    <!-- [Insert your existing HTML structure from the previous code block] -->
</body>
</html>
