<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BAYAN Company (BCT) - Communication Portal</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics.js";
        const firebaseConfig = {
            apiKey: "AIzaSyAUQl0ozyAaI6UrM98uYVWIdK1kobjjL4g",
            authDomain: "bct-66404.firebaseapp.com",
            databaseURL: "https://bct-66404-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bct-66404",
            storageBucket: "bct-66404.firebasestorage.app",
            messagingSenderId: "337031921557",
            appId: "1:337031921557:web:b28321a917c3bdf572809c",
            measurementId: "G-LZ2XK1EF0H"
        };
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        :root { --primary-gold: #b38f4f; --dark-gold: #8e6f37; --dark-bg: #111111; --card-bg: #1a1a1a; --text-light: #ffffff; --text-muted: #aaaaaa; --border-color: #333333; --success-green: #2ecc71; --error-red: #e74c3c; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-light); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; overflow: hidden; }
        .portal-container { background-color: var(--card-bg); width: 100%; max-width: 420px; padding: 30px 20px; border-radius: 12px; border: 1px solid var(--border-color); text-align: center; }
        .dashboard-container { display: none; background-color: var(--card-bg); width: 100%; max-width: 900px; height: 85vh; border-radius: 12px; border: 1px solid var(--border-color); grid-template-columns: 260px 1fr; overflow: hidden; }
        .logo-area { margin-bottom: 20px; } .logo-icon { font-size: 54px; font-weight: bold; color: var(--primary-gold); line-height: 1; margin-bottom: 5px; font-family: 'Times New Roman', Times, serif; }
        .company-name { font-size: 22px; font-weight: 700; text-transform: uppercase; } .company-subtext { font-size: 13px; color: var(--primary-gold); letter-spacing: 3px; font-weight: bold; }
        .input-group { margin-bottom: 20px; text-align: left; } .input-group label { display: block; font-size: 11px; text-transform: uppercase; color: var(--primary-gold); margin-bottom: 8px; }
        .input-group select, .input-group input { width: 100%; padding: 12px; background-color: #222; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; font-size: 16px; }
        .login-btn { width: 100%; padding: 14px; background-color: var(--primary-gold); border: none; border-radius: 6px; color: #111; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .sidebar { background-color: #111; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; }
        .chat-area { display: flex; flex-direction: column; background: #161616; min-height: 0; }
        .messages-window { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 85%; padding: 10px 14px; border-radius: 8px; font-size: 14px; word-break: break-word; }
        .msg.received { background: #222; align-self: flex-start; border: 1px solid var(--border-color); }
        .msg.sent { background: var(--primary-gold); color: #111; align-self: flex-end; }
        .msg-meta { font-size: 10px; color: var(--text-muted); display: block; margin-bottom: 3px; }
        .del-btn { background: none; border: none; color: #000; font-size: 9px; cursor: pointer; text-decoration: underline; margin-left: 10px; opacity: 0.6; }
        .input-bar { padding: 15px; background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; gap: 8px; }
        .input-bar input { flex: 1; padding: 12px; background: #111; border: 1px solid var(--border-color); border-radius: 6px; color: #fff; }
        .send-btn { padding: 0 15px; background: var(--primary-gold); border: none; border-radius: 6px; color: #111; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="portal-container" id="loginScreen">
        <div class="logo-area">
            <div class="logo-icon">B</div>
            <div class="company-name">Bayan Company</div>
        </div>
        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>Select Identity</label>
                <select id="portal-id" required>
                    <option value="" disabled selected>-- Select Member --</option>
                    <option value="Eng. Ahmed Nabil">Eng. Ahmed Nabil</option>
                    <option value="Eng. Youssef Nabil">Eng. Youssef Nabil</option>
                </select>
            </div>
            <div class="input-group">
                <label>Security Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="login-btn">Secure Login</button>
        </form>
    </div>

    <div class="dashboard-container" id="dashboardScreen">
        <aside class="sidebar" id="sidebarMenu">
            <div style="color:var(--primary-gold); font-weight:bold; margin-bottom:20px;">BCT Portal</div>
            <div id="displayUser" style="font-size:12px; margin-bottom:20px;"></div>
            <button onclick="handleLogout()" style="background:none; border:1px solid var(--error-red); color:var(--error-red); padding:5px; cursor:pointer;">Disconnect</button>
        </aside>
        <main class="chat-area">
            <div class="messages-window" id="messagesWindow"></div>
            <form class="input-bar" onsubmit="sendMessage(event)">
                <input type="text" id="typeBox" placeholder="Type a message..." required>
                <button type="submit" class="send-btn">Send</button>
            </form>
        </main>
    </div>

    <script>
        const userCredentials = { 'Eng. Ahmed Nabil': 'Bayan2026', 'Eng. Youssef Nabil': 'Bayan2026' };
        let currentActiveUser = "", client = null;
        const CHAT_TOPIC = "bayan/company/bct_broadcast_channel_main";

        function loadChatHistory() {
            const history = JSON.parse(localStorage.getItem('bct_chat_history') || '[]');
            history.forEach(m => renderMessageUI(m.sender, m.message, m.isSelf, m.id));
        }

        function renderMessageUI(sender, message, isSelf, id) {
            const windowObj = document.getElementById('messagesWindow');
            const delBtn = isSelf ? `<button class="del-btn" onclick="deleteMessage(${id})">Delete</button>` : "";
            windowObj.insertAdjacentHTML('beforeend', `
                <div class="msg ${isSelf ? 'sent' : 'received'}" id="msg-${id}">
                    <span class="msg-meta">${sender} ${delBtn}</span>
                    ${message}
                </div>`);
            windowObj.scrollTop = windowObj.scrollHeight;
        }

        function deleteMessage(id) {
            document.getElementById(`msg-${id}`).remove();
            let history = JSON.parse(localStorage.getItem('bct_chat_history') || '[]');
            history = history.filter(m => m.id !== id);
            localStorage.setItem('bct_chat_history', JSON.stringify(history));
        }

        function saveMessage(id, sender, message, isSelf) {
            const history = JSON.parse(localStorage.getItem('bct_chat_history') || '[]');
            history.push({ id, sender, message, isSelf });
            localStorage.setItem('bct_chat_history', JSON.stringify(history));
        }

        function handleLogin(event) {
            event.preventDefault();
            const id = document.getElementById('portal-id').value;
            if (userCredentials[id] === document.getElementById('password').value) {
                currentActiveUser = id;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'grid';
                document.getElementById('displayUser').innerText = "User: " + id;
                loadChatHistory();
                initLiveSync();
            }
        }

        function initLiveSync() {
            client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
            client.on('connect', () => client.subscribe(CHAT_TOPIC));
            client.on('message', (topic, payload) => {
                const data = JSON.parse(payload.toString());
                renderMessageUI(data.user, data.message, false, data.id);
                saveMessage(data.id, data.user, data.message, false);
            });
        }

        function sendMessage(event) {
            event.preventDefault();
            const input = document.getElementById('typeBox');
            const id = Date.now();
            client.publish(CHAT_TOPIC, JSON.stringify({ user: currentActiveUser, message: input.value, id: id }));
            renderMessageUI("You", input.value, true, id);
            saveMessage(id, "You", input.value, true);
            input.value = "";
        }

        function handleLogout() { location.reload(); }
    </script>
</body>
</html>
